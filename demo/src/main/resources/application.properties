spring.application.name=demo

# Import local development properties if present (ignored in git)
spring.config.import=optional:classpath:application-local.properties

# MySQL Connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gqldemo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable GraphiQL (the in-browser interactive GraphQL playground)
spring.graphql.graphiql.enabled=true
spring.graphql.cors.allowed-origins=*
